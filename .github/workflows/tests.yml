name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (pandas ${{ matrix.pandas }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # pyproject.toml allows both pandas 2.x and 3.x, and they differ in ways
      # that matter here (e.g. pct_change forward-fills gaps by default on 2.x,
      # which silenced the engine's missing-price warning). Test both.
      matrix:
        pandas: ["2.2.*", "3.*"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]" "pandas==${{ matrix.pandas }}"

      - name: Show pandas version
        run: python -c "import pandas; print('pandas', pandas.__version__)"

      # The live SEC EDGAR integration check is excluded on every matrix leg: CI
      # should not depend on SEC's availability or rate limits. Everything else
      # is network-mocked.
      - name: Run tests
        run: >
          python -m pytest -v
          --deselect tests/test_data.py::test_load_fundamentals_real_aapl_returns_nonempty_2019_2020

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check

      - name: ruff format
        run: ruff format --check

      - name: mypy
        run: mypy
